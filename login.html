{% extends 'index.html' %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 380px; border-radius: 15px;">

        <h3 class="text-center mb-4 fw-bold">Login</h3>

        <form method="POST">

            <div class="mb-3">
                <label class="from-label fw-semibold">Username</label>
                <input class="form-control" type="text" name="username" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input class="form-control" type="password" name="password" placeholder="Enter password" required>
            </div>

            <button class="btn btn-primary w-100 mt-2 shadow-sm">Login</button>

        </form>

        <p class="text-center mt-3 mb-0">
            Dont have an account?
            <a href="{{ url_for('register')}}" class="fw-semibold">Register</a>
        </p>
    </div>
</div>

{% endblock %}
