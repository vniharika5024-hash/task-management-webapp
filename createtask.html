{% extends 'index.html' %}
{% block content %}
 <div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 fw-bold">Create New Task</h3>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Task Title</label>
                        <input class="form-control form-control-lg" type="text" name="title" placeholder="Enter task title....." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" name="description" rows="4" placeholder="Enter task details here....."></textarea>
                    </div>
                    <button class="btn btn-success w-100 py-2 fw-semibold">Create Task</button>
                </form>
            </div>    
        </div>
    </div>
 </div>

{% endblock %}
