{% extends 'index.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounder-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 fw-bold">Update Task</h3>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Task Title</label>
                        <input class="form-control form-control-lg" type="text" name="title" value="{{ task.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" name="description" row="4">{{ task.description }}</textarea>
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-semibold">Save Updates</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
