{% extends 'index.html' %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow p-4" style="width: 420px; border-radius: 15px;">

        <h2 class="text-center mb-4 fw-bold">Create Account</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input class="form-control form-control-lg" type="text" name="username" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input class="form-control form-control-lg" type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button class="btn btn-success w-100 py-2 fw-semibold">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}" class="fw-semibold">Login</a>
        </p>
    </div>
</div>

{% endblock %}
